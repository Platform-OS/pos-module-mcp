mutation profiles_post_count_increment(
  $id: ID!
) {
  record: record_update(
    id: $id
    record: {
      table: "modules/user/profile"
      properties: [
        { name: "post_count", increment: 1 }
      ]
    }
  ) {
    id
    created_at
    type: table

    post_count: property_int(name: "post_count")
  }
}
