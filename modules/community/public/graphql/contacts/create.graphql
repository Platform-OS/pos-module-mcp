mutation create_contact(
  $email: String!
  $message: String!
  $reason: String
) {
  record: record_create(
    record: {
      table: "modules/community/contact"
      properties: [
        { name: "email" value: $email }
        { name: "message" value: $message }
        { name: "reason" value: $reason }
      ]
    }
  ){
    id 
    properties
  }
}
