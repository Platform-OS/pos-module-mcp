query search(
  $id: ID
  $limit: Int = 20
  $page: Int = 1
  $sort: [RecordsSortInput!] = [{ created_at: { order: DESC } }]
  $name: String
  $keyword: String
  $not_name: String
  $not_type: String
  $not_ids: [ID!]
  $owner_id: String
  $relation_name: String
  $with_owner: Boolean = false
  $profile_table: [String]!
  $relationships: Boolean = false
  $meta_visible: String
  $ask_to_join: String
  $featured: Boolean
) {
  groups: records(
    per_page: $limit
    page: $page
    filter: {
      id: { value: $id, not_value_in: $not_ids }
      table: { value: "modules/community/group" }
      properties: [
        { name: "name", value: $name }
        { name: "name", not_value: $not_name }
        { name: "group_type", not_value: $not_type }
        { name: "meta_visible", value: $meta_visible }
        { name: "ask_to_join", value: $ask_to_join }
        { name: "featured_at", exists: $featured }
      ]
      or: [
        { properties: { name: "name", contains: $keyword } }
        { properties: { name: "summary", contains: $keyword } }
        { properties: { name: "description", contains: $keyword } }
      ]
      related_records: {
        join: { join_on_property: "id", foreign_property: "r_id" }
        filter: {
          table: { value: "modules/community/relationship" }
          properties: [
            { name: "l_id", value: $owner_id }
            { name: "name", value: $relation_name }
          ]
        }
      }
    }
    sort: $sort
  ) {
    total_entries
    total_pages
    current_page
    has_previous_page
    has_next_page
    per_page
    results {
      ...group
    }
  }
}

fragment group on Record {
  id
  created_at
  type: table

  uuid: property(name: "uuid")
  name: property(name: "name")
  summary: property(name: "summary")
  description: property(name: "description")
  code_of_conduct: property(name: "code_of_conduct")
  content_type: property(name: "content_type")
  content_types: property_array(name: "content_types")
  group_type: property(name: "group_type")
  ask_to_join: property(name: "ask_to_join")
  meta_visible: property(name: "meta_visible")
  content_visible: property(name: "content_visible")
  approve_request: property(name: "approve_request")
  post_content: property(name: "post_content")
  add_comments: property(name: "add_comments")
  invite_member: property(name: "invite_member")
  c__members_count: property_int(name: "c__members_count")
  c__full_members_count: property_int(name: "c__full_members_count")
  c__posts_count: property_int(name: "c__posts_count")

  main_photo: related_record(table: "modules/community/photo", join_on_property: "uuid", foreign_property: "object_uuid") {
    id
    photo_width: property_int(name: "photo_width")
    photo_height: property_int(name: "photo_height")
    photo: property_upload(name: "photo") {
      url
      versions
    }
  }
  owner: related_records(
    table: "modules/community/relationship"
    join_on_property: "id"
    foreign_property: "r_id"
    filter: { properties: { value: "owner", name: "name" } }
  ) @include(if: $with_owner) {
    id
    properties
    profile: related_record(table: $profile_table, join_on_property: "l_id") {
      id
      type: table
      properties
      name: property(name: "name")
      first_name: property(name: "first_name")
      last_name: property(name: "last_name")
      slug: property(name: "slug")
      avatar: related_record(
        table: "modules/community/photo"
        join_on_property: "uuid"
        foreign_property: "object_uuid"
        filter: { properties: { name: "photo_type", value: "avatar" } }
      ) {
        photo_width: property_int(name: "photo_width")
        photo_height: property_int(name: "photo_height")
        photo: property_upload(name: "photo") {
          url
          versions
        }
      }
    }
  }

  relationships: related_records(table: "modules/community/relationship" join_on_property: "id" foreign_property: "r_id") @include(if: $relationships) {
    id
    name: property(name: "name")
    r_id: property(name: "r_id")
    l_id: property(name: "l_id")
  }
  featured_at: property(name: "featured_at")
}
