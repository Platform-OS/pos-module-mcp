mutation groups_post_count_decrement(
  $id: ID!
) {
  record: record_update(
    id: $id
    record: {
      table: "modules/community/group"
      properties: [
        { name: "c__posts_count", decrement: 1 }
      ]
    }
  ) {
    id
    created_at
    type: table

    post_count: property_int(name: "c__posts_count")
  }
}
