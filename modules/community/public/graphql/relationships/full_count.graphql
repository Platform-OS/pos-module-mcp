query records(
  $name: String!
  $r_id: String
  $l_id: String
){
  records(
    per_page: 1
    filter: {
      properties: [
        { name: "name" value: $name }
        { name: "r_id" value: $r_id }
        { name: "l_id" value: $l_id }
        { name: "l_accepted_at" exists: true }
        { name: "r_accepted_at" exists: true }
      ]
    }
  ){
    total_entries
  }
}
