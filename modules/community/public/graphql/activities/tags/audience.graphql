query search(
  $id: ID
  $names: [String!]
  $limit: Int = 1
) {
  tags: records(
    per_page: $limit
    filter: {
      id: { value: $id }
      table: { value: "modules/community/tag" }
      properties: [
        { name: "name" value_in: $names }
        { name: "status" value: "published" }
      ]
    }
    sort: [{ created_at: { order: DESC } }]
  ) {
    total_entries
    results {
      ...tag
    }
  }
}

fragment tag on Record {
  id
  created_at
  type: table

  name: property(name: "name")

  relationships: related_records(table: "modules/community/relationship" join_on_property: "id" foreign_property: "r_id"
  ) {
    id
    name: property(name: "name")
    r_id: property(name: "r_id")
    l_id: property(name: "l_id")
  }
}
